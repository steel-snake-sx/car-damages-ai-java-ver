spring.application.name=car-damages-ai-java-ver

spring.r2dbc.url=${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/car_damage}
spring.r2dbc.username=${DB_USERNAME:car_damage}
spring.r2dbc.password=${DB_PASSWORD:car_damage}

spring.flyway.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/car_damage}
spring.flyway.user=${DB_USERNAME:car_damage}
spring.flyway.password=${DB_PASSWORD:car_damage}
spring.flyway.placeholders.admin-email=${ADMIN_EMAIL:admin@localhost}
spring.flyway.placeholders.admin-password-hash=${ADMIN_PASSWORD_HASH}

spring.webflux.multipart.max-in-memory-size=64KB
spring.webflux.multipart.max-disk-usage-per-part=10MB
spring.webflux.multipart.max-parts=6

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000
spring.kafka.consumer.group-id=car-damage-analysis
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.steelsnake.cardamage.claim.DamageAnalysisRequested
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.steelsnake.cardamage.claim
app.kafka.analysis-retry-interval=5s

app.image-storage.directory=${IMAGE_STORAGE_PATH:./data/images}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:PT1H}

app.ai.provider=${AI_PROVIDER:mock}
app.ai.retry-attempts=2
app.ai.retry-backoff=2s
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4.1}
app.ai.openai.timeout=${OPENAI_TIMEOUT:PT60S}
