spring.application.name=car-damages-ai-java-ver

spring.r2dbc.url=${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/car_damage}
spring.r2dbc.username=${DB_USERNAME:car_damage}
spring.r2dbc.password=${DB_PASSWORD:car_damage}

spring.flyway.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/car_damage}
spring.flyway.user=${DB_USERNAME:car_damage}
spring.flyway.password=${DB_PASSWORD:car_damage}
spring.flyway.placeholders.admin-email=${ADMIN_EMAIL:admin@localhost}
spring.flyway.placeholders.admin-password-hash=${ADMIN_PASSWORD_HASH}

spring.webflux.multipart.max-in-memory-size=64KB
spring.webflux.multipart.max-disk-usage-per-part=10MB
spring.webflux.multipart.max-parts=6

app.image-storage.directory=${IMAGE_STORAGE_PATH:./data/images}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:PT1H}
