name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: chmod +x gradlew && ./gradlew cleanTest build

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t car-damages-ai-java-ver .
